# SciFlow Prompt 契约评估（promptfoo）
# 离线可跑：先构建 server，再起 mock HTTP 网关（node:http 包装脚本，复用 mock 网关路由表，
# 监听 127.0.0.1:5099），promptfoo 直连该端点。
# 用法：
#   1) pnpm --filter @sciflow/server build
#   2) node apps/server/scripts/mock-openai-http.mjs &
#   3) pnpm exec promptfoo eval -c evals/promptfooconfig.yaml
# 真实模型回归：把 providers 换成你的 OpenAI 兼容端点（PROMPTFOO_* 环境变量或直接改 apiBaseUrl）。
description: SciFlow prompt 契约评估（mock 网关离线模式）
providers:
  - id: openai:chat:mock-model
    config:
      apiBaseUrl: http://127.0.0.1:5099/v1
      apiKey: sk-mock-local-placeholder
prompts:
  - '{{prompt}}'
tests:
  - description: 连接测试语义：只回"正常"
    vars:
      prompt: '请只回复两个字：正常'
    assert:
      - type: contains
        value: 正常
  - description: 大纲 prompt 契约：必须产出可解析的 sections JSON
    vars:
      prompt: |
        你是一位资深学术写作专家。请为一个研究主题设计论文大纲（outline-first 方法）。
        研究主题：图神经网络在生物医药中的应用综述
        请输出严格的 JSON（不要任何其他文字），结构如下：
        { "title": "论文标题", "sections": [{ "title": "章节标题", "subsections": ["小节1"] }] }
    assert:
      - type: contains
        value: sections
      - type: javascript
        value: |
          const m = output.match(/\{[\s\S]*\}/);
          if (!m) return false;
          try { const o = JSON.parse(m[0]); return typeof o.title === 'string' && Array.isArray(o.sections); } catch { return false; }
