# 依赖更新策略：每周检查一次，避免一次性堆积上百条告警
version: 2
updates:
  # 根包（eslint / prettier / promptfoo / playwright 等工具链）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 安全更新单独立组：优先处理
      security:
        applies-to: security-updates
        patterns: ['*']
      tooling:
        applies-to: version-updates
        patterns: ['eslint*', 'prettier*', 'typescript-eslint*', '@typescript-eslint/*']
        update-types: [minor, patch]

  # 后端
  - package-ecosystem: npm
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: '04:10'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, server]
    commit-message:
      prefix: 'chore(deps-server)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      runtime-minor:
        applies-to: version-updates
        update-types: [minor, patch]

  # 前端
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: 'chore(deps-web)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      runtime-minor:
        applies-to: version-updates
        update-types: [minor, patch]

  # 桌面端（Electron 升级需同步验证原生模块 ABI 重编）
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies, desktop]
    commit-message:
      prefix: 'chore(deps-desktop)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']

  # GitHub Actions 自身
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
