# 依赖更新策略：每周检查一次，避免一次性堆积上百条告警
#
# 设计要点（2026-10-15 实践校准）：
#   1. 安全更新单独立组，优先处理；
#   2. **阻断会产生"CI 红"的跨 major 自动提案** —— 实测以下 major 升级需要配套迁移
#      （原生模块 ABI / 插件链联动 / API 重写 / peer 不兼容），机器人直接提 PR 只会制造
#      失败噪声（一次性出现 9 条红 PR）。因此按目录逐一 ignore 其 major，patch/minor 照常。
#   3. major 升级走人工专项：升完必须跑通本地全门禁 + 三仓 CI。
version: 2
updates:
  # ---------------- 根包（工具链：eslint / prettier / promptfoo / playwright） ----------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      tooling:
        applies-to: version-updates
        patterns: ['eslint*', 'prettier*', 'typescript-eslint*', '@typescript-eslint/*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # ---------------- 后端 ----------------
  - package-ecosystem: npm
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: '04:10'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, server]
    commit-message:
      prefix: 'chore(deps-server)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      runtime-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/common'
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/core'
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/platform-express'
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/swagger'
        update-types: [version-update:semver-major]
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]
      - dependency-name: '@citation-js/plugin-ris'
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: zod
        update-types: [version-update:semver-major]
      - dependency-name: msw
        update-types: [version-update:semver-major]

  # ---------------- 前端 ----------------
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '04:20'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: 'chore(deps-web)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      runtime-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # vite 需与 vitest/tailwind 插件链联动；recharts 3 是图表 API 重写（components/charts.tsx 需迁移）；
      # katex 0.19 与 rehype-katex@7 / micromark-extension-math@3 的 ^0.16 peer 不兼容
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: '@vitejs/plugin-react'
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: recharts
        update-types: [version-update:semver-major]
      - dependency-name: katex
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@tanstack/react-table'
        update-types: [version-update:semver-major]
      - dependency-name: '@tanstack/react-query'
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: '@tailwindcss/vite'
        update-types: [version-update:semver-major]
      - dependency-name: '@tailwindcss/typography'
        update-types: [version-update:semver-major]
      - dependency-name: diff
        update-types: [version-update:semver-major]
      - dependency-name: happy-dom
        update-types: [version-update:semver-major]

  # ---------------- 桌面端（electron 升级必须同步验证原生模块 ABI 重编 + 打包） ----------------
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: [dependencies, desktop]
    commit-message:
      prefix: 'chore(deps-desktop)'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: electron-builder
        update-types: [version-update:semver-major]
      - dependency-name: electron-updater
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # ---------------- GitHub Actions 自身 ----------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
