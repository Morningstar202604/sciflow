services:
  server:
    build:
      context: .
      target: server
    ports:
      - "3000:3000"
    volumes:
      - ./apps/server/data:/app/apps/server/data   # SQLite 数据持久化
    environment:
      - PORT=3000
      # ⚠️ 必填：替换为你的 AI 网关地址与密钥（支持 OpenAI / DeepSeek / 通义 / 豆包 / Agnes 等 OpenAI 兼容接口）
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:?请在 .env 中设置 AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_MODEL_FAST=${AI_MODEL_FAST:-}
      - AI_MODEL_STRONG=${AI_MODEL_STRONG:-}
      - AI_RPM_CAP=${AI_RPM_CAP:-8}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
