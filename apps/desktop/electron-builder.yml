# ============ SciFlow 桌面端打包配置（electron-builder） ============
appId: io.sciflow.desktop
productName: SciFlow
copyright: Copyright © 2026 SciFlow Contributors

directories:
  output: release
  buildResources: build

# asar 只装主进程/preload 编译产物（小），重资源走 extraResources（asar 外，原生模块必须）
asar: true
files:
  - dist-electron/**/*
  - package.json

# 注意（踩坑记录，勿回退）：
# electron-builder 的 extraResources 过滤器里有硬编码规则
#   文件 app-builder-lib/out/util/filter.js → createFilter()
#     if (relative === "node_modules") return false;   // 永远排除**根级** node_modules
# 结果：当 from 目录自身就是 bundle 根（resources/server）时，其 node_modules（pnpm deploy 产出的
# 全部生产依赖）会被静默丢弃 —— 实测 0.4.0→0.4.1 安装包从 1.42GB 掉到 100MB，应用启动即崩。
# 规避方式：把 bundle 放进二级目录（resources/bundle/server），使相对路径不为 "node_modules"。
extraResources:
  - from: resources/bundle
    to: bundle
  - from: resources/web
    to: web

# ---------- Windows ----------
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SciFlow
  artifactName: SciFlow-Setup-${version}-${arch}.${ext}

# ---------- macOS ----------
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: SciFlow-${version}-${arch}.${ext}

# ---------- Linux ----------
linux:
  icon: build/icon.png
  category: Science
  target:
    - AppImage
    - deb
  maintainer: SciFlow Contributors
  artifactName: SciFlow-${version}-${arch}.${ext}

# 压缩级别：normal（安装包体积与安装速度平衡）
compression: normal
npmRebuild: false
