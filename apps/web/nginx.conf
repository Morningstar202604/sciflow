server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 压缩：JS/CSS/SVG/JSON 传输体积减少 60–80%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/javascript application/javascript application/json text/css image/svg+xml;

    # SPA 路由回退（前端为 state 切换视图，保留以备后续路由化）
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存：保证发版即生效（带 hash 的静态资源走下面 immutable 缓存）
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Vite 带 hash 的静态资源：一年 immutable 缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 品牌/公共静态资源：7 天缓存
    location ~* \.(png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 后端 API 反代（含 SSE 流式问答：关闭缓冲，避免打字机效果被攒包）
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE 必需：逐块透传
        proxy_cache off;
        proxy_read_timeout 600s;      # 长流水线/长回答
        proxy_send_timeout 300s;
        client_max_body_size 64m;     # 文献/知识库上传
    }
}
