<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="SciFlow app icon">
  <!--
    SciFlow 主图标（App Icon Master · 1024×1024）· 品牌修订 2026-10
    概念：一笔流动的 S —— Science + Flow，科研流程如水贯通。
    规范：品牌渐变 teal → cyan → sky（135°），白色流线 S，圆角方形底（r≈22%）。
    导出：本文件是唯一图标源；PNG/ICO/ICNS 由 scripts/generate-icons.mjs 从此渲染，禁止手改位图。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9e94"/>
      <stop offset="0.52" stop-color="#0b8fb4"/>
      <stop offset="1" stop-color="#0b6fc4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eafcff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#04323f" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#sheen)"/>

  <!-- 一笔流线 S：起笔右上、收笔左下，圆头端点，粗细一致 -->
  <path d="M 738 268
           C 646 176, 452 168, 366 262
           C 274 362, 372 468, 512 502
           C 652 536, 752 590, 716 694
           C 680 798, 500 838, 330 748"
        fill="none" stroke="url(#ink)" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
</svg>
