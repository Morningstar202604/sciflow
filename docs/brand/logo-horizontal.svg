<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-label="SciFlow 横版标识">
  <!--
    SciFlow 横版组合标识（Logo Lockup）
    结构：渐变圆角方标志 + 词标「SciFlow」+ 标语「让科研从想法到成文」
    适用：README、官网页头、文档封面、启动页。最小宽度 220px。
  -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9e94"/>
      <stop offset="0.52" stop-color="#0b8fb4"/>
      <stop offset="1" stop-color="#0b6fc4"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f9e94"/>
      <stop offset="1" stop-color="#0b6fc4"/>
    </linearGradient>
  </defs>

  <!-- 标志（80×80，视觉留白 8px；与 icon-master 同一几何） -->
  <g transform="translate(8 8)">
    <rect width="80" height="80" rx="18" fill="url(#mark)"/>
    <path d="M 57.8 21
             C 50.5 13.8, 35.3 13.1, 28.5 20.5
             C 21.4 28.2, 29.0 36.6, 40.0 39.3
             C 51.0 41.9, 58.8 46.1, 56.0 54.3
             C 53.1 62.4, 39.1 65.5, 25.8 58.5"
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 词标 -->
  <text x="104" y="52" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1c2a44">Sci</tspan><tspan fill="url(#flow)">Flow</tspan>
  </text>

  <!-- 标语 -->
  <text x="105" y="74" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif"
        font-size="13" fill="#64748b" letter-spacing="1">让科研从想法到成文</text>
</svg>
